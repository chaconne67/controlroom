name: Workspace sync

on:
  push:
    paths:
      - '.github/workflows/workspace-sync.yml'
      - 'install.*'
      - 'shell/**'
      - 'scripts/check-*-sync.py'
      - 'manifests/**'
      - 'projects/**'
      - 'gbrain-cards/**'
      - 'README.md'
      - 'docs/onboarding-new-server.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native installer and entrypoint contracts
        run: python -X utf8 scripts/check-kit-sync.py EntryPointDocumentationTests WindowsInstallerTests PosixControlRoomInstallerTests -v
      - name: Existing POSIX command contracts
        if: runner.os != 'Windows'
        run: python -X utf8 scripts/check-kit-sync.py KitSyncTests -v
      - name: Two control rooms and failure preservation
        run: python -X utf8 scripts/check-workspace-sync.py -v
