name: Workspace sync

on:
  push:
    paths:
      - '.github/workflows/workspace-sync.yml'
      - '.controlroom/**'
      - '*/docs/**'
      - '*/skills/**'
      - '*/AGENTS.md'
      - '*/CLAUDE.md'
      - 'README.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Physical sources and dependencies
        run: python -X utf8 .controlroom/scripts/check-skill-deps.py
      - name: Native installer and entrypoint contracts
        run: python -X utf8 .controlroom/scripts/check-kit-sync.py EntryPointDocumentationTests WindowsInstallerTests PosixControlRoomInstallerTests -v
      - name: Existing POSIX command contracts
        if: runner.os != 'Windows'
        run: python -X utf8 .controlroom/scripts/check-kit-sync.py KitSyncTests GBrainAccessTests -v
      - name: Two control rooms and failure preservation
        run: python -X utf8 .controlroom/scripts/check-workspace-sync.py -v
